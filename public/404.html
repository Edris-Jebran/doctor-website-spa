<!DOCTYPE html>
<html lang="fa-AF" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>صفحه پیدا نشد | داکتر احسان جبران</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fc; color: #121a33;
        font-family: Vazirmatn, Tahoma, system-ui, sans-serif; line-height: 1.7; }
      main { max-width: 32rem; padding: 2rem 1.5rem; text-align: start; }
      h1 { color: #1f3a93; font-size: 1.6rem; margin: 1rem 0 0.25rem; font-weight: 700; }
      p { margin: 0.25rem 0; color: #4f5a73; }
      .links { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.25rem; border-radius: 6px;
        text-decoration: none; font-weight: 500; }
      .primary { background: #1f3a93; color: #fff; }
      .secondary { border: 1px solid #1f3a93; color: #1f3a93; }
      a:focus-visible { outline: 3px solid #1f3a93; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" width="48" height="48" alt="" />
      <h1>این صفحه پیدا نشد</h1>
      <p>آدرسی که باز کردید وجود ندارد.</p>
      <p lang="en" dir="ltr">This page doesn't exist.</p>
      <div class="links">
        <a class="primary" href="/">صفحهٔ اصلی</a>
        <a class="secondary" href="/en/" lang="en">English home page</a>
      </div>
    </main>
  </body>
</html>
